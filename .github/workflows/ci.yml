name: CI

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libssl-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Test Rust workspace
        run: cargo +stable test --locked --workspace

      - name: Build desktop application
        run: cargo +stable build --locked -p uninstallany-gui

      - name: Build Windows MSI helper
        if: runner.os == 'Windows'
        run: >-
          cargo +stable build --locked -p uninstallany-windows
          --features privileged-helper --bin uninstallany-helper

      - name: Test release packaging scripts
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

  macos-host:
    name: macOS Tauri and frontend
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        run: npm install --global pnpm@12.16.1

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Test Tauri host
        run: cargo +stable test --locked --manifest-path apps/macos-host/Cargo.toml

      - name: Test host with macOS helper enabled
        run: >-
          cargo +stable test --locked --manifest-path apps/macos-host/Cargo.toml
          --features macos-privileged-helper
