[workspace]

[package]
name = "uninstallany-macos-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
macos-privileged-helper = ["uninstallany-macos/privileged-inspection"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.12.5", default-features = false, features = ["custom-protocol", "wry"] }
uninstallany-core = { path = "../../crates/uninstallany-core" }
uninstallany-macos = { path = "../../crates/uninstallany-macos" }
uuid = { version = "=1.23.0", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = "=2.7.6"

[profile.release]
strip = true
lto = "thin"
