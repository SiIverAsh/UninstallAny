[workspace]
members = [
    "crates/uninstallany-core",
    "crates/uninstallany-windows",
    "crates/uninstallany-unix",
    "crates/uninstallany-macos",
    "crates/uninstallany-linux",
    "crates/uninstallany-gui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "=1.23.0", features = ["v4", "serde"] }

[profile.release]
strip = true
lto = "thin"

